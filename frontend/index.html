<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidora - AI Powered Video Sharing</title>
    
    <!-- Supabase JS Library (সুবাফেস কানেক্ট করার জন্য) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h2>Vidora Video Upload</h2>

    <!-- ভিডিও আপলোড ফর্ম -->
    <form id="uploadForm">
        
        <!-- ভিডিও শিরোনামের ইনপুট -->
        <input type="text" id="videoTitle" placeholder="ভিডিও শিরোনাম লিখুন..." required>
        <br><br>
        
        <!-- ভিডিও ফাইল সিলেক্ট ইনপুট -->
        <input type="file" id="videoFile" accept="video/*" required>
        <br><br>

        <!-- 🛑 রোবট চেক ফিল্ড (হানি পট) -->
        <input type="text" id="robotCheck" name="robotCheck" style="display:none !important;" tabindex="-1" autocomplete="off">

        <!-- সাবমিট বাটন -->
        <button type="submit">Upload Video</button>
    </form>

    <!-- সিকিউরিটি ও আপলোড স্ক্রিপ্ট -->
    <script src="script.js"></script>

</body>
</html>
