<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidora - Home</title>
    <link rel="stylesheet" href="frontend/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="navbar">
        <div class="logo-container" onclick="window.location.href='index.html'">
            <i class="fa-brands fa-youtube logo-icon"></i>
            <span class="logo-text">Vidora</span>
        </div>
        
        <div class="search-bar">
            <input type="text" placeholder="Search">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="user-actions">
            <button class="upload-btn" onclick="openModal()"><i class="fa-solid fa-plus"></i> Create</button>
            <div class="user-avatar">V</div>
        </div>
    </header>

    <main class="main-content">
        <h2>Recommended Videos</h2>
        <div class="video-grid" id="videoGallery">
            <p>Loading videos...</p>
        </div>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2>Upload Video</h2>
            <form id="uploadForm">
                <input type="text" id="robotCheck" style="display:none;">
                <input type="file" id="videoFile" accept="video/*" required>
                <input type="text" id="videoTitle" placeholder="Video Title" required>
                <button type="submit">Upload</button>
            </form>
        </div>
    </div>

    <script src="frontend/script.js"></script>
</body>
</html>
