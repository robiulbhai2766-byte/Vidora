<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidora - Watch & Share Videos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- YouTube Style Header Bar -->
    <header class="navbar">
        <div class="logo-container">
            <i class="fa-brands fa-youtube logo-icon"></i>
            <span class="logo-text">Vidora</span>
        </div>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search videos...">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="user-actions">
            <button class="upload-btn" onclick="openModal()"><i class="fa-solid fa-video"></i> Create</button>
            <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
        </div>
    </header>

    <!-- Upload Modal Pop-up -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2>Upload Video to Vidora</h2>
            
            <form id="uploadForm">
                <input type="text" id="videoTitle" placeholder="Video Title" required>
                <input type="file" id="videoFile" accept="video/*" required>
                
                <!-- Security Honeypot -->
                <input type="text" id="robotCheck" style="display:none !important;" tabindex="-1" autocomplete="off">

                <button type="submit" id="submitBtn">Upload</button>
            </form>
        </div>
    </div>

    <!-- YouTube Style Video Grid Feed -->
    <main class="main-content">
        <h2>Recommended Videos</h2>
        <div id="videoGallery" class="video-grid">
            <p class="loading-text">Loading videos...</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
