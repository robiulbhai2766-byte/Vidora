<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidora - AI Powered Video Sharing</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <h1>Vidora</h1>
        <p class="subtitle">AI-Powered Video Sharing Platform</p>

        <!-- ভিডিও আপলোড সেকশন -->
        <div class="card">
            <h2>ভিডিও আপলোড করুন</h2>
            <form id="uploadForm">
                <input type="text" id="videoTitle" placeholder="ভিডিও শিরোনাম লিখুন..." required>
                <input type="file" id="videoFile" accept="video/*" required>
                
                <!-- 🛑 রোবট চেক (Honeypot) -->
                <input type="text" id="robotCheck" name="robotCheck" style="display:none !important;" tabindex="-1" autocomplete="off">

                <button type="submit" id="uploadBtn">Upload Video</button>
            </form>
        </div>

        <!-- ভিডিও গ্যালারি সেকশন -->
        <div class="gallery-section">
            <h2>সাম্প্রতিক আপলোডসমূহ</h2>
            <div id="videoGallery" class="gallery-grid">
                <p>ভিডিও লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
